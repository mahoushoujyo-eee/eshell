name: build-tauri

on:
  workflow_dispatch:
    inputs:
      dmg_url:
        description: >-
          Optional .dmg URL to assess with the macOS Gatekeeper check (e.g. a
          release asset). Leave empty to assess the dmg built by this run.
        type: string
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact_name: eshell-windows-x64
            tauri_args: ""
          - platform: ubuntu-latest
            artifact_name: eshell-linux-x64
            tauri_args: ""
          - platform: macos-latest
            artifact_name: eshell-macos-arm64
            tauri_args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      # `--include=optional` is load-bearing, not decoration. npm silently skips
      # platform-scoped optional dependencies (npm/cli#4828, still open) and
      # every native binary in this tree is one of them: without
      # `@tauri-apps/cli-<platform>` the Tauri CLI cannot even be required, so
      # `tauri build` dies in the same second it starts. The lockfile already
      # records all platform variants — it is the install that drops them.
      - name: Install frontend dependencies
        run: npm ci --include=optional

      # Makes the next occurrence legible. The failure this guards against lands
      # ten steps later with a generic "Cannot find native binding" and no
      # package name, and the job log needs a token to read.
      - name: Verify the platform's native packages
        shell: bash
        run: bash scripts/verify-native-deps.sh

      - name: Build Tauri bundles
        shell: bash
        env:
          # Signs the updater artifacts (.sig) required by tauri-plugin-updater.
          # This is a minisign key for the in-app updater — it has nothing to do
          # with Apple code signing, despite the name.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple code signing + notarization. Only the macOS runner uses these,
          # and only when they are configured: without them `tauri build` ships
          # an unsigned bundle, which Gatekeeper refuses on a downloaded copy
          # (the "「eshell.dmg」已损坏" report — see scripts/macos-gatekeeper-check.sh).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # An unconfigured secret arrives as an empty string, and Tauri tests
          # for presence: signing with an empty identity fails the build. Drop
          # the empty ones so a repo without Apple credentials builds exactly as
          # it did before, on every platform.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then unset "$name"; fi
          done

          if [ -n "${{ matrix.tauri_args }}" ]; then
            npx tauri build ${{ matrix.tauri_args }}
          else
            npx tauri build
          fi

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**

  # Reproduces what a downloading Mac user gets from the .dmg: the Gatekeeper
  # assessment, the codesign/notarization state, and the same artifact scored
  # with and without the quarantine attribute Finder adds. Nothing on the
  # Windows/Linux runners can see any of this, so it is the only automated place
  # where "the installer says it is damaged" is observable.
  #
  # Run it from the Actions tab with `dmg_url` pointed at an *already released*
  # dmg to reproduce a user report without owning a Mac.
  gatekeeper-check:
    needs: build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the built macOS bundle
        if: inputs.dmg_url == ''
        uses: actions/download-artifact@v4
        with:
          name: eshell-macos-arm64
          path: bundle

      - name: Fetch the .dmg to assess
        if: inputs.dmg_url != ''
        env:
          DMG_URL: ${{ inputs.dmg_url }}
        run: |
          mkdir -p bundle
          curl -fsSL -o bundle/artifact.dmg "$DMG_URL"

      # `--allow-unsigned` reports instead of failing: an unsigned artifact is the
      # current known state, and a red X on every tag would not tell anyone
      # anything new. A harness failure still exits non-zero, which
      # `continue-on-error` keeps from blocking the release — but it fails the
      # step and gets annotated, because a check that cannot run is exactly the
      # thing that must not pass silently.
      #
      # The output is captured and re-annotated on failure: the job log body is
      # not reachable without a token, so the annotation is the only machine-
      # readable trace of what went wrong (and the quickest one in the UI).
      - name: Assess the .dmg like a downloading user
        id: assess
        continue-on-error: true
        shell: bash
        run: |
          find bundle -type f | head -20
          dmg="$(find bundle -name '*.dmg' -type f | sort | head -1)"
          if [ -z "$dmg" ]; then
            echo "::error::no .dmg found in the bundle artifact"
            exit 1
          fi
          echo "assessing $dmg"
          log="$RUNNER_TEMP/gatekeeper.log"
          status=0
          # Through `bash` rather than ./: the file is committed without the exec
          # bit, and this way a checkout quirk cannot look like a verdict.
          bash scripts/macos-gatekeeper-check.sh "$dmg" --allow-unsigned >"$log" 2>&1 || status=$?
          cat "$log"
          if [ "$status" -ne 0 ]; then
            echo "::error title=Gatekeeper check failed (exit $status)::$(tail -c 1200 "$log" | tr '\n' '~')"
          fi
          exit "$status"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      # The release body comes from a file in the repo, so the job needs the
      # checkout it otherwise would not ask for.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bundled artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate updater manifest (latest.json)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          version="${TAG#v}"
          base_url="$REPO_URL/releases/download/$TAG"
          platforms="{}"

          # Installers land in bundle subdirectories (nsis/, msi/, macos/,
          # appimage/), so resolve each candidate by name wherever it sits;
          # the release asset itself is uploaded flat.
          add() {
            local platform="$1" name="$2" path
            [ -n "$name" ] || return 0
            path="$(find release-artifacts -name "$name" -type f | sort | head -1)"
            [ -n "$path" ] || return 0
            # A .sig next to the installer proves it was signed with the updater key.
            [ -f "$path.sig" ] || return 0
            platforms=$(jq -n --arg platform "$platform" --argjson platforms "$platforms" \
              --arg url "$base_url/$name" --rawfile signature "$path.sig" \
              '$platforms + {($platform): {url: $url, signature: $signature}}')
          }

          # NSIS is the preferred Windows update channel; fall back to the msi.
          for file in $(find release-artifacts -name "*-setup.exe" | sort | head -1); do add windows-x86_64 "${file##*/}"; done
          if ! jq -e 'has("windows-x86_64")' >/dev/null 2>&1 <<<"$platforms"; then
            for file in $(find release-artifacts -name "*.msi" | sort | head -1); do add windows-x86_64 "${file##*/}"; done
          fi
          for file in $(find release-artifacts -name "*.app.tar.gz" | sort | head -1); do add darwin-aarch64 "${file##*/}"; done
          for file in $(find release-artifacts -name "*.AppImage" | sort | head -1); do add linux-x86_64 "${file##*/}"; done

          if [ "$platforms" = "{}" ]; then
            echo "::warning::no signed updater artifacts found; skipping latest.json"
            exit 0
          fi

          jq -n --arg version "$version" --argjson platforms "$platforms" \
            '{version: $version, pub_date: (now | todateiso8601), platforms: $platforms}' \
            > release-artifacts/latest.json
          cat release-artifacts/latest.json

      # The release body is the hand-written notes at
      # docs/releases/<tag>.md, NOT the GitHub-generated commit/PR list: a
      # changelog of bare links tells a user nothing about what changed.
      # This step fails the job when the file is missing, so a release can
      # never ship with an empty body.
      - name: Check release notes exist
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::missing release notes at $notes — write them before tagging"
            exit 1
          fi
          echo "Release notes: $notes"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            release-artifacts/**/*.msi
            release-artifacts/**/*-setup.exe
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.dmg
            release-artifacts/**/*.app.tar.gz
            release-artifacts/**/*.tar.gz
            release-artifacts/**/latest.json
