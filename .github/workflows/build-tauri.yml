name: build-tauri

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact_name: eshell-windows-x64
            tauri_args: ""
          - platform: ubuntu-latest
            artifact_name: eshell-linux-x64
            tauri_args: ""
          - platform: macos-latest
            artifact_name: eshell-macos-arm64
            tauri_args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri bundles
        shell: bash
        env:
          # Signs the updater artifacts (.sig) required by tauri-plugin-updater.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "${{ matrix.tauri_args }}" ]; then
            npx tauri build ${{ matrix.tauri_args }}
          else
            npx tauri build
          fi

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      # The release body comes from a file in the repo, so the job needs the
      # checkout it otherwise would not ask for.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download bundled artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate updater manifest (latest.json)
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          version="${TAG#v}"
          base_url="$REPO_URL/releases/download/$TAG"
          platforms="{}"

          # Installers land in bundle subdirectories (nsis/, msi/, macos/,
          # appimage/), so resolve each candidate by name wherever it sits;
          # the release asset itself is uploaded flat.
          add() {
            local platform="$1" name="$2" path
            [ -n "$name" ] || return 0
            path="$(find release-artifacts -name "$name" -type f | sort | head -1)"
            [ -n "$path" ] || return 0
            # A .sig next to the installer proves it was signed with the updater key.
            [ -f "$path.sig" ] || return 0
            platforms=$(jq -n --arg platform "$platform" --argjson platforms "$platforms" \
              --arg url "$base_url/$name" --rawfile signature "$path.sig" \
              '$platforms + {($platform): {url: $url, signature: $signature}}')
          }

          # NSIS is the preferred Windows update channel; fall back to the msi.
          for file in $(find release-artifacts -name "*-setup.exe" | sort | head -1); do add windows-x86_64 "${file##*/}"; done
          if ! jq -e 'has("windows-x86_64")' >/dev/null 2>&1 <<<"$platforms"; then
            for file in $(find release-artifacts -name "*.msi" | sort | head -1); do add windows-x86_64 "${file##*/}"; done
          fi
          for file in $(find release-artifacts -name "*.app.tar.gz" | sort | head -1); do add darwin-aarch64 "${file##*/}"; done
          for file in $(find release-artifacts -name "*.AppImage" | sort | head -1); do add linux-x86_64 "${file##*/}"; done

          if [ "$platforms" = "{}" ]; then
            echo "::warning::no signed updater artifacts found; skipping latest.json"
            exit 0
          fi

          jq -n --arg version "$version" --argjson platforms "$platforms" \
            '{version: $version, pub_date: (now | todateiso8601), platforms: $platforms}' \
            > release-artifacts/latest.json
          cat release-artifacts/latest.json

      # The release body is the hand-written notes at
      # docs/releases/<tag>.md, NOT the GitHub-generated commit/PR list: a
      # changelog of bare links tells a user nothing about what changed.
      # This step fails the job when the file is missing, so a release can
      # never ship with an empty body.
      - name: Check release notes exist
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::missing release notes at $notes — write them before tagging"
            exit 1
          fi
          echo "Release notes: $notes"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: false
          fail_on_unmatched_files: false
          files: |
            release-artifacts/**/*.msi
            release-artifacts/**/*-setup.exe
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.dmg
            release-artifacts/**/*.app.tar.gz
            release-artifacts/**/*.tar.gz
            release-artifacts/**/latest.json
